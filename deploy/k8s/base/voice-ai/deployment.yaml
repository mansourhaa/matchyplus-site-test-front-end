apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-voice-ai
  labels:
    app.kubernetes.io/name: saas-voice-ai
    app.kubernetes.io/component: voice-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-voice-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-voice-ai
        app.kubernetes.io/component: voice-ai
    spec:
      # Disable Kubernetes service link injection so VOICE_AI_PORT=tcp://... is not set and passed to uvicorn --port.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: voice-ai
          image: saas-boilerplate-voice-ai:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: VOICE_AI_PORT
              value: "8001"
            - name: MODELS_DIR
              value: /models
            - name: HF_HOME
              value: /models/huggingface
            - name: DERJA_ENGINE
              value: vosk
            - name: WHISPER_SIZE
              value: small
            - name: LLM_MODE
              value: "off"
            - name: PRELOAD_MODELS
              value: "false"
            - name: DOWNLOAD_MODELS
              value: "true"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
            - name: models
              mountPath: /models
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: var-tmp
          emptyDir: {}
        - name: models
          persistentVolumeClaim:
            claimName: saas-voice-ai-models
