apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: saas-api
  labels:
    app.kubernetes.io/name: saas-api
    app.kubernetes.io/component: api
spec:
  serviceName: saas-api-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-api
        app.kubernetes.io/component: api
    spec:
      # aiuser in saas-ai has the same uid/gid (1001) as fastify here: both can write and
      # delete in the shared uploads volume.
      securityContext:
        fsGroup: 1001
      containers:
        - name: api
          image: saas-boilerplate-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: saas-api-env
          env:
            # Restart-stable unique id per replica (saas-api-0, saas-api-1, …).
            # Same id across restarts keeps the Redis consumer group and self-origin skip working.
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            # media-storage.ts: <workdir>/apps/api/uploads, shared with saas-ai.
            - name: uploads
              mountPath: /server/apps/api/uploads
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: saas-uploads
